<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>1장 보고서</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#DADAD6;font-family:"Pretendard","Malgun Gothic",sans-serif;color:#141414;display:grid;place-items:center}
.sheet{width:1180px;height:840px;background:#FAFAF8;padding:48px 72px;box-shadow:0 2px 0 #bbb}
.top{display:flex;justify-content:space-between;align-items:start}
.logo{font-size:15px;letter-spacing:.3em}
.sign{display:grid;grid-template-columns:repeat(3,110px);border:2px solid #141414;text-align:center;font-size:14px}
.sign div{border-left:1px solid #141414;padding:6px}.sign div:first-child{border-left:0}
.sign .b{height:80px;border-top:1px solid #141414;display:grid;place-items:center;font-size:12px}
.title{margin-top:28px;background:#1F3B63;color:#fff;padding:26px 32px;font-size:58px;font-weight:800;letter-spacing:-.02em}
ul{list-style:none;margin-top:36px;display:grid;gap:22px;font-size:26px}
li::before{content:"□ ";font-weight:700}
.req{margin-top:48px;display:grid;grid-template-columns:160px 1fr 1fr 220px;border:2px solid #141414;height:72px;align-items:center}
.req span{border-right:1px solid #141414;height:100%;display:grid;place-items:center;font-weight:700}
.req input{border:0;border-right:1px solid #141414;height:100%;padding:0 16px;font-size:16px;background:transparent}
.req button{height:100%;border:0;background:#C2392E;color:#fff;font-size:18px;font-weight:700}
</style></head><body><div class="sheet">
<div class="top"><div class="logo">LUNA MARKETING LAB · 마케팅 실행 보고</div>
<div class="sign"><div>담당</div><div>검토</div><div>대표</div><div class="b"></div><div class="b"></div><div class="b">GMU 디지털마케팅<br>애널리틱스 학사</div></div></div>
<div class="title">데이터로 판단하는 마케팅 파트너</div>
<ul><li>목표: 측정 가능한 KPI부터 합의하고 시작</li><li>방법: GA4·A/B 테스트로 검증한 뒤 예산 확대</li><li>근거: TripSIM·FlytoX·원작소 직접 운영 경험</li></ul>
<form class="req"><span>검토 요청</span><input placeholder="회사명"><input placeholder="이메일"><button>상담 요청</button></form>
</div></body></html>
