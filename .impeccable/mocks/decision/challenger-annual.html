<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>연감 도판</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;background:#F5F4F6;font-family:"Pretendard",sans-serif;color:#16181A;position:relative}
.bar{height:72px;border-bottom:1px solid #C9C7C4;display:flex;justify-content:space-between;align-items:center;padding:0 48px;font-family:monospace;font-size:13px;letter-spacing:.14em}
h1{position:absolute;left:48px;top:140px;width:520px;font-size:80px;font-weight:400;line-height:1.05;letter-spacing:-.02em}
.plate{position:absolute;left:640px;top:140px;width:752px;height:520px;background:#cfd6dc}
.plate::after{content:"TripSIM 화면";position:absolute;inset:0;display:grid;place-items:center;color:#566}
.stamp{position:absolute;left:590px;top:560px;width:150px;height:150px;border-radius:50%;background:#DCDDF3;display:grid;place-items:center;text-align:center;font-size:13px}
.cta{position:absolute;left:48px;top:560px;width:280px;height:64px;background:#16181A;color:#fff;display:grid;place-items:center;font-family:monospace;letter-spacing:.12em}
.credits{position:absolute;left:48px;right:48px;top:720px;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #C9C7C4;font-size:15px}
.credits div{padding:16px;border-right:1px solid #C9C7C4}
</style></head><body>
<div class="bar"><span>LUNA MARKETING LAB</span><span>WORK · SERVICES · PROCESS · CONTACT</span></div>
<h1>직접 운영해<br>검증한 마케팅</h1>
<div class="cta">상담 신청</div>
<div class="plate"></div><div class="stamp">GMU<br>디지털마케팅<br>애널리틱스</div>
<div class="credits"><div>01 TripSIM</div><div>02 FlytoX</div><div>03 SK쉴더스</div><div>04 원작소</div></div>
</body></html>
